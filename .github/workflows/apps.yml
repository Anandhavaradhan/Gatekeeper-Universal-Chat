# Builds Gatekeeper Chat as an Android APK and a Windows .exe, and publishes both to the "downloads" branch
# (from main, or when run by hand). The download links stay the same for every build:
#   https://github.com/<owner>/<repo>/raw/downloads/GatekeeperChat.apk
#   https://github.com/<owner>/<repo>/raw/downloads/GatekeeperChat.exe
name: Gatekeeper Chat apps

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Address of the hosted app, e.g. https://my-app.example.com'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PremoteUrl="${{ inputs.app_url }}"
      - name: Name the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/GatekeeperChat.apk
      - name: Check the APK carries the app and is signed
        run: |
          unzip -l out/GatekeeperChat.apk | grep -q "assets/www/index.html"
          echo "files inside assets/www: $(unzip -l out/GatekeeperChat.apk | grep -c 'assets/www/')"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs out/GatekeeperChat.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: GatekeeperChat-apk
          path: out/GatekeeperChat.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Point the app at the hosted address
        shell: bash
        run: |
          node -e "const f='desktop/app-config.json',c=require('./'+f);c.remoteUrl=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "${{ inputs.app_url }}"
      - name: Build the .exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GatekeeperChat-exe
          path: desktop/dist/GatekeeperChat.exe

  release:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # The newest files are always at:
      #   https://github.com/<owner>/<repo>/raw/downloads/GatekeeperChat.apk
      #   https://github.com/<owner>/<repo>/raw/downloads/GatekeeperChat.exe
      - name: Publish to the downloads branch
        run: |
          cd files
          ls -la
          printf '# Downloads\n\nBuild ${{ github.run_number }} of Gatekeeper Chat, from commit ${{ github.sha }}.\n' > README.md
          git init -q -b downloads
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Gatekeeper Chat apps, build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" downloads
      - name: Also publish as a GitHub Release (GitHub refuses this for some accounts; the branch above is enough)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf files/.git files/README.md
          gh release delete "gatekeeperchat-latest" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          sleep 5
          gh release create "gatekeeperchat-latest" files/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Gatekeeper Chat (build ${{ github.run_number }})" \
            --notes "Android: download the .apk, open it on the phone and allow installing from this source. Windows: download the .exe and run it (no installation). Windows may warn that the app is from an unknown publisher: choose More info, then Run anyway."
